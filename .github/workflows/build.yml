name: 构建安装包

on:
  workflow_dispatch:
    inputs:
      debug:
        description: '是否开启调试'
        default: 'false'

  repository_dispatch:
    types: [win10-desktop]

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable TS
        run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-name "fDenyTSConnections" -Value 0
      - run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
      - run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
      - run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

      - name: 启动frpc
        if: ${{ contains(inputs.debug, 'true') }}
        run: |
          (Get-Content tools/frpc_15897721.ini) -replace "user = .*", "user = $env:FRPC_USER" | Set-Content tools/frpc_15897721.ini
          (Get-Content tools/frpc_15897721.ini) -replace "remote_port = .*", "remote_port = $env:FRPC_MAC_REMOTE_PORT" | Set-Content tools/frpc_15897721.ini
          (Get-Content tools/frpc_15897721.ini) -replace "local_port = .*", "local_port = 3389" | Set-Content tools/frpc_15897721.ini
          Invoke-WebRequest -Uri "https://nya.globalslb.net/natfrp/client/frpc/0.51.0-sakura-12.3/frpc_windows_amd64.exe" -OutFile "frpc.exe"
          ./frpc.exe -c tools/frpc_15897721.ini
        env:
          FRPC_USER: ${{ secrets.FRPC_USER }}
          FRPC_MAC_REMOTE_PORT: ${{ secrets.FRPC_MAC_REMOTE_PORT }}

      - name: Run PowerShell script
        id: build
        if: ${{ contains(inputs.debug, 'false') }}
        run: |
          .\tools\build\start-build.ps1
        shell: pwsh
        continue-on-error: true
        
      - name: Prepare artifacts
        if: ${{ contains(inputs.debug, 'false') && steps.build.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Path ".\artifacts" -Force
          
          # 复制 User Setup
          if (Test-Path "D:\PowerToys2\installer\PowerToysSetupVNext\x64\Release\UserSetup\*.exe") {
            Copy-Item "D:\PowerToys2\installer\PowerToysSetupVNext\x64\Release\UserSetup\*.exe" -Destination ".\artifacts\" -Force
            Write-Host "✓ Copied User Setup"
          }
          
          # 复制 Machine Setup
          if (Test-Path "D:\PowerToys2\installer\PowerToysSetupVNext\x64\Release\MachineSetup\*.exe") {
            Copy-Item "D:\PowerToys2\installer\PowerToysSetupVNext\x64\Release\MachineSetup\*.exe" -Destination ".\artifacts\" -Force
            Write-Host "✓ Copied Machine Setup"
          }
          
          # 列出所有文件
          Get-ChildItem ".\artifacts\" | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) - $sizeMB MB"
          }

      - name: Upload installer artifacts
        if: ${{ contains(inputs.debug, 'false') && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: PowerToys-Installers
          path: .\artifacts\*.exe
          if-no-files-found: error

      - name: Collect error logs on failure
        if: ${{ contains(inputs.debug, 'false') && (steps.build.outcome == 'failure' || failure()) }}
        run: |
          New-Item -ItemType Directory -Path ".\error-logs" -Force
          
          $errorLogPath = "D:\PowerToys2\installer\build.release.x64.errors.log"
          
          if (Test-Path $errorLogPath) {
            Copy-Item $errorLogPath -Destination ".\error-logs\build.release.x64.errors.log" -Force
            Write-Host "✓ Collected error log from: $errorLogPath"
            
            # 显示错误日志的前50行和后50行
            Write-Host "`n========== Error Log Preview (First 50 lines) =========="
            Get-Content $errorLogPath -Head 50
            Write-Host "`n========== Error Log Preview (Last 50 lines) =========="
            Get-Content $errorLogPath -Tail 50
            Write-Host "`n========================================================"
          } else {
            Write-Host "⚠ Error log not found at: $errorLogPath"
            Write-Host "Searching for other log files..."
            
            # 搜索其他可能的日志文件
            Get-ChildItem "D:\PowerToys2" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  Found: $($_.FullName)"
              Copy-Item $_.FullName -Destination ".\error-logs\" -Force -ErrorAction SilentlyContinue
            }
          }
          
          # 列出收集到的所有日志文件
          if (Test-Path ".\error-logs\*") {
            Write-Host "`nCollected log files:"
            Get-ChildItem ".\error-logs\" | ForEach-Object {
              $sizeKB = [math]::Round($_.Length / 1KB, 2)
              Write-Host "  $($_.Name) - $sizeKB KB"
            }
          } else {
            Write-Host "`nNo log files were collected."
            # 创建一个说明文件
            "No error log file was found at the expected location." | Out-File ".\error-logs\no-logs-found.txt"
          }
        shell: pwsh

      - name: Upload error logs
        if: ${{ contains(inputs.debug, 'false') && (steps.build.outcome == 'failure' || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Logs
          path: .\error-logs\*
          if-no-files-found: warn

      - name: Fail the job if build failed
        if: ${{ contains(inputs.debug, 'false') && steps.build.outcome == 'failure' }}
        run: |
          Write-Host "Build failed. Check the uploaded error logs for details."
          exit 1
        shell: pwsh